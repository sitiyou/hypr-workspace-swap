[repository]
name = "hypr-workspace-swap"
authors = ["sitiyou"]

[hypr-workspace-swap]
description = "Exchange workspace banks without rebuilding layouts (Hyprland 0.57.1)"
authors = ["sitiyou"]
output = "build/hypr-workspace-swap.so"
build = [
    "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF",
    "cmake --build build --parallel 2"
]
